server {
    listen 80;
    server_name kuotax.store;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kuotax.store;
    
    ssl_certificate /etc/letsencrypt/live/kuotax.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuotax.store/privkey.pem;
    
    # Timeout untuk Socket.IO
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        
        # Header untuk WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Header standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # TAMBAHAN untuk Cloudflare
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-RAY $http_cf_ray;
        
        # Penting untuk Socket.IO
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Route khusus Socket.IO (optional, tapi recommended)
    location /socket.io/ {
        proxy_pass http://localhost:3005/socket.io/;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout lebih lama untuk WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}