<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - KUOTAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            text-align: center;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .offline-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }
        }

        h1 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .retry-button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .tips {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

        .tips h3 {
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .tips ul {
            list-style: none;
            text-align: left;
        }

        .tips li {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
            padding-left: 24px;
            position: relative;
        }

        .tips li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 20px;
            }

            .logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="/images/logoa.png" alt="KUOTAX" class="logo">

        <div class="offline-icon">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </div>

        <h1>Anda Sedang Offline</h1>
        <p>Tidak ada koneksi internet. Pastikan WiFi atau data seluler Anda aktif untuk menggunakan KUOTAX.</p>

        <button class="retry-button" onclick="location.reload()">
            Coba Lagi
        </button>

        <div class="tips">
            <h3>Tips:</h3>
            <ul>
                <li>Periksa koneksi WiFi atau data seluler</li>
                <li>Aktifkan mode Airplane lalu matikan lagi</li>
                <li>Restart router atau modem</li>
                <li>Hubungi provider jika masalah berlanjut</li>
            </ul>
        </div>
    </div>

    <script>
        // Auto-retry ketika online kembali
        window.addEventListener('online', function() {
            location.reload();
        });

        // Check connection setiap 5 detik
        setInterval(function() {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
